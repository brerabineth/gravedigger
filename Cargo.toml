[package]
name = "gravedigger"
version = "0.1.0"
edition = "2021"
authors = ["Brerabin"]
description = "first-hour forensic triage for unix hosts: timeline, hashing, strings, IOC hunt, artifact sweep"
license = "MIT"
repository = "https://github.com/brerabineth/gravedigger"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
hex = "0.4"
md-5 = "0.10"
once_cell = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
